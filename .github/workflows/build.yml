name: Needlelight CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Frontend + Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Tauri icon
        run: node -e "const fs=require('fs');const path=require('path');const b='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=';const icons=['icon.png','icon-512.png'];for (const file of icons){const iconPath=path.join('src-tauri','icons',file);if(!fs.existsSync(iconPath)){fs.mkdirSync(path.dirname(iconPath),{recursive:true});fs.writeFileSync(iconPath,Buffer.from(b,'base64'));}}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml


  release-build:
    name: Build ${{ matrix.platform }} release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            bundle: appimage
            bundle_directory: appimage
            artifact_name: Needlelight-Linux
            release_file: Needlelight-Linux.AppImage
            artifact_files: Needlelight-Linux.AppImage
          - os: windows-latest
            platform: Windows
            bundle: nsis
            bundle_directory: nsis
            artifact_name: Needlelight-Windows
            release_file: Needlelight-Windows.exe
            artifact_files: Needlelight-Windows.exe
          - os: macos-latest
            platform: macOS
            bundle: dmg
            bundle_directory: dmg
            artifact_name: Needlelight-macOS
            release_file: Needlelight-macOS.dmg
            artifact_files: Needlelight-macOS.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Tauri icon
        run: node -e "const fs=require('fs');const path=require('path');const b='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=';const icons=['icon.png','icon-512.png'];for (const file of icons){const iconPath=path.join('src-tauri','icons',file);if(!fs.existsSync(iconPath)){fs.mkdirSync(path.dirname(iconPath),{recursive:true});fs.writeFileSync(iconPath,Buffer.from(b,'base64'));}}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install platform dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Name release files
        shell: bash
        run: |
          set -euo pipefail
          root="src-tauri/target/release/bundle/${{ matrix.bundle_directory }}"
          case "${{ matrix.platform }}" in
            Windows)
              source=$(find "$root" -type f -iname '*-setup.exe' -print -quit)
              if [ -z "$source" ]; then
                echo "Windows setup installer not found under $root" >&2
                find "$root" -type f -maxdepth 2 -print >&2 || true
                exit 1
              fi
              cp "$source" "Needlelight-Windows.exe"
              ;;
            Linux)
              source=$(find "$root" -type f -name '*.AppImage' -print -quit)
              if [ -z "$source" ]; then
                echo "Linux AppImage not found under $root" >&2
                exit 1
              fi
              cp "$source" "Needlelight-Linux.AppImage"
              ;;
            macOS)
              source=$(find "$root" -type f -name '*.dmg' -print -quit)
              if [ -z "$source" ]; then
                echo "macOS DMG not found under $root" >&2
                exit 1
              fi
              cp "$source" "Needlelight-macOS.dmg"
              ;;
          esac

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_files }}
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_files }}
