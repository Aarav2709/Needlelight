name: Needlelight CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Frontend + Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Tauri icon
        run: node -e "const fs=require('fs');const path=require('path');const b='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=';const icons=['icon.png','icon-512.png'];for (const file of icons){const iconPath=path.join('src-tauri','icons',file);if(!fs.existsSync(iconPath)){fs.mkdirSync(path.dirname(iconPath),{recursive:true});fs.writeFileSync(iconPath,Buffer.from(b,'base64'));}}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml


  release-build:
    name: Build ${{ matrix.platform }} release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            bundle: appimage
            bundle_directory: appimage
            bundle_extension: .AppImage
            artifact_name: Needlelight-Linux
            release_file: Needlelight-Linux.AppImage
            portable_file: ""
            artifact_files: Needlelight-Linux.AppImage
          - os: windows-latest
            platform: Windows
            bundle: nsis
            bundle_directory: nsis
            bundle_extension: .exe
            artifact_name: Needlelight-Windows
            release_file: Needlelight-Windows.exe
            portable_file: Needlelight-Windows-Portable.exe
            artifact_files: |
              Needlelight-Windows.exe
              Needlelight-Windows-Portable.exe
          - os: macos-latest
            platform: macOS
            bundle: dmg
            bundle_directory: dmg
            bundle_extension: .dmg
            artifact_name: Needlelight-macOS
            release_file: Needlelight-macOS.dmg
            portable_file: ""
            artifact_files: Needlelight-macOS.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Tauri icon
        run: node -e "const fs=require('fs');const path=require('path');const b='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=';const icons=['icon.png','icon-512.png'];for (const file of icons){const iconPath=path.join('src-tauri','icons',file);if(!fs.existsSync(iconPath)){fs.mkdirSync(path.dirname(iconPath),{recursive:true});fs.writeFileSync(iconPath,Buffer.from(b,'base64'));}}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install platform dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Name release files
        env:
          BUNDLE_DIRECTORY: ${{ matrix.bundle_directory }}
          BUNDLE_EXTENSION: ${{ matrix.bundle_extension }}
          RELEASE_FILE: ${{ matrix.release_file }}
          PORTABLE_FILE: ${{ matrix.portable_file }}
        run: >-
          node -e "const fs=require('fs'); const path=require('path'); const root=path.join('src-tauri','target','release','bundle',process.env.BUNDLE_DIRECTORY); const find=(dir)=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?find(path.join(dir,e.name)):[path.join(dir,e.name)]).find(p=>p.endsWith(process.env.BUNDLE_EXTENSION)); const source=find(root); if(!source) throw new Error('Bundled release file not found'); fs.copyFileSync(source,process.env.RELEASE_FILE); if(process.env.PORTABLE_FILE) fs.copyFileSync(path.join('src-tauri','target','release','Needlelight.exe'),process.env.PORTABLE_FILE);"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_files }}
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_files }}
