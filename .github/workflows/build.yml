name: Needlelight CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Frontend + Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Tauri icon
        run: node -e "const fs=require('fs');const path=require('path');const b='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=';const icons=['icon.png','icon-512.png'];for (const file of icons){const iconPath=path.join('src-tauri','icons',file);if(!fs.existsSync(iconPath)){fs.mkdirSync(path.dirname(iconPath),{recursive:true});fs.writeFileSync(iconPath,Buffer.from(b,'base64'));}}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml


  release-build:
    name: Build ${{ matrix.platform }} release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    env:
      # updater artifacts are only signed and published once the signing key secret exists
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            bundle: appimage
            bundle_directory: appimage
            artifact_name: Needlelight-Linux
            release_file: Needlelight-Linux.AppImage
            artifact_files: Needlelight-Linux.AppImage
          - os: windows-latest
            platform: Windows
            bundle: nsis
            bundle_directory: nsis
            artifact_name: Needlelight-Windows
            release_file: Needlelight-Windows.exe
            artifact_files: Needlelight-Windows.exe
          - os: macos-latest
            platform: macOS
            bundle: app,dmg
            bundle_directory: dmg
            artifact_name: Needlelight-macOS
            release_file: Needlelight-macOS.dmg
            artifact_files: Needlelight-macOS.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Tauri icon
        run: node -e "const fs=require('fs');const path=require('path');const b='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR4nGNgYAAAAAMAASsJTYQAAAAASUVORK5CYII=';const icons=['icon.png','icon-512.png'];for (const file of icons){const iconPath=path.join('src-tauri','icons',file);if(!fs.existsSync(iconPath)){fs.mkdirSync(path.dirname(iconPath),{recursive:true});fs.writeFileSync(iconPath,Buffer.from(b,'base64'));}}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install platform dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            config=$(node -e "console.log(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.UPDATER_PUBKEY}}}))")
            pnpm tauri build --bundles ${{ matrix.bundle }} --config "$config"
          else
            pnpm tauri build --bundles ${{ matrix.bundle }}
          fi

      - name: Name release files
        shell: bash
        run: |
          set -euo pipefail
          root="src-tauri/target/release/bundle/${{ matrix.bundle_directory }}"
          case "${{ matrix.platform }}" in
            Windows)
              source=$(find "$root" -type f -iname '*-setup.exe' -print -quit)
              if [ -z "$source" ]; then
                echo "Windows setup installer not found under $root" >&2
                find "$root" -type f -maxdepth 2 -print >&2 || true
                exit 1
              fi
              cp "$source" "Needlelight-Windows.exe"
              if [ "$HAS_SIGNING_KEY" = "true" ]; then cp "$source.sig" "Needlelight-Windows.exe.sig"; fi
              ;;
            Linux)
              echo "Looking for AppImage bundles under $root"
              source=$(find "$root" -type f \( -name '*.AppImage' -o -name '*.appimage' \) -print | head -n 1)
              if [ -z "$source" ]; then
                echo "Linux AppImage not found under $root" >&2
                find "$root" -maxdepth 3 -type f -print >&2 || true
                exit 1
              fi
              echo "Using bundle: $source"
              cp "$source" "Needlelight-Linux.AppImage"
              if [ "$HAS_SIGNING_KEY" = "true" ]; then cp "$source.sig" "Needlelight-Linux.AppImage.sig"; fi
              ;;
            macOS)
              source=$(find "$root" -type f -name '*.dmg' -print -quit)
              if [ -z "$source" ]; then
                echo "macOS DMG not found under $root" >&2
                exit 1
              fi
              cp "$source" "Needlelight-macOS.dmg"
              if [ "$HAS_SIGNING_KEY" = "true" ]; then
                archive=$(find src-tauri/target/release/bundle/macos -type f -name '*.app.tar.gz' -print -quit)
                cp "$archive" "Needlelight-macOS.app.tar.gz"
                cp "$archive.sig" "Needlelight-macOS.app.tar.gz.sig"
              fi
              ;;
          esac

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_files }}
          if-no-files-found: error

      - name: Upload updater signatures
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-updater
          path: |
            Needlelight-*.sig
            Needlelight-macOS.app.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_files }}
            Needlelight-*.sig
            Needlelight-macOS.app.tar.gz

  updater-manifest:
    name: Publish updater manifest
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/checkout@v4

      - name: Download updater signatures
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: "*-updater"
          path: updater
          merge-multiple: true

      - name: Write latest.json
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          node -e "
          const fs = require('fs')
          const version = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version
          const platforms = {}
          const add = (key, file) => {
            const sig = 'updater/' + file + '.sig'
            if (fs.existsSync(sig)) platforms[key] = { signature: fs.readFileSync(sig, 'utf8').trim(), url: process.env.RELEASE_URL + '/' + file }
          }
          add('windows-x86_64', 'Needlelight-Windows.exe')
          add('linux-x86_64', 'Needlelight-Linux.AppImage')
          add('darwin-aarch64', 'Needlelight-macOS.app.tar.gz')
          fs.writeFileSync('latest.json', JSON.stringify({ version, pub_date: new Date().toISOString(), platforms }, null, 2))
          console.log(fs.readFileSync('latest.json', 'utf8'))
          "

      - name: Attach latest.json to the release
        if: env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
